<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>东方财富API测试</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #e0e0e0; }
        h2 { color: #00d4ff; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .test { margin: 10px 0; padding: 15px; background: #16213e; border-radius: 8px; }
        .pass { color: #00ff88; }
        .fail { color: #ff4444; }
        .info { color: #aaa; }
        pre { background: #0f0f23; padding: 10px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
        button { padding: 8px 20px; margin: 5px; background: #00d4ff; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #00b8d4; }
        #summary { margin-top: 20px; padding: 15px; background: #0f3460; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>东方财富API浏览器端测试</h1>
    <p class="info">使用浏览器JSONP方式测试，绕过Python/curl的TLS指纹检测</p>
    <button onclick="runAllTests()">运行全部测试</button>
    <button onclick="location.href='index.html'">返回主页</button>

    <div id="results"></div>
    <div id="summary" style="display:none"></div>

    <script>
    const results = {};
    let testIndex = 0;

    /**
     * JSONP请求
     */
    function jsonp(url, callbackName, timeout = 15000) {
        return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            let timer;

            window[callbackName] = function(data) {
                clearTimeout(timer);
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                resolve(data);
            };

            script.onerror = function() {
                clearTimeout(timer);
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('JSONP脚本加载失败'));
            };

            timer = setTimeout(() => {
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
                reject(new Error('JSONP请求超时'));
            }, timeout);

            const sep = url.includes('?') ? '&' : '?';
            script.src = url + sep + 'cb=' + callbackName;
            document.head.appendChild(script);
        });
    }

    /**
     * Fetch请求
     */
    async function fetchApi(url) {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        return await resp.json();
    }

    /**
     * 添加测试结果到页面
     */
    function addResult(name, status, details) {
        const div = document.createElement('div');
        div.className = 'test';
        div.innerHTML = `<h3>${status === 'PASS' ? '<span class="pass">[PASS]</span>' : '<span class="fail">[FAIL]</span>'} ${name}</h3><pre>${details}</pre>`;
        document.getElementById('results').appendChild(div);
    }

    /**
     * 测试1: 涨幅排行API (JSONP)
     */
    async function testClistJsonp() {
        const name = '涨幅排行API (clist + JSONP)';
        try {
            const cbName = 'jQuery_test1_' + Date.now();
            const url = 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&ut=b2884a393a59ad64002292a3e90d46a5&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f12,f14,f2,f3,f13&_=' + Date.now();

            const data = await jsonp(url, cbName);

            let details = `rc: ${data.rc}\n`;
            details += `total: ${data.data?.total || 'N/A'}\n`;
            details += `diff数量: ${data.data?.diff?.length || 0}\n\n`;

            if (data.data?.diff?.length > 0) {
                details += '前3条数据:\n';
                data.data.diff.slice(0, 3).forEach((item, i) => {
                    details += `  [${i}] f12(代码)=${item.f12}, f14(名称)=${item.f14}, f2(最新价)=${item.f2}, f3(涨幅%)=${item.f3}, f13(市场)=${item.f13}\n`;
                });

                const required = ['f12', 'f14', 'f2', 'f3', 'f13'];
                const missing = required.filter(f => !(f in data.data.diff[0]));
                details += `\n字段检查: ${missing.length === 0 ? '全部存在' : '缺失: ' + missing.join(', ')}`;
            }

            const pass = data.rc === 0 && data.data?.diff?.length > 0;
            addResult(name, pass ? 'PASS' : 'FAIL', details);
            return pass;
        } catch (e) {
            addResult(name, 'FAIL', `错误: ${e.message}`);
            return false;
        }
    }

    /**
     * 测试2: 涨幅排行API (Fetch)
     */
    async function testClistFetch() {
        const name = '涨幅排行API (clist + Fetch)';
        try {
            const url = 'https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5&po=1&np=1&ut=b2884a393a59ad64002292a3e90d46a5&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f12,f14,f2,f3,f13&_=' + Date.now();

            const data = await fetchApi(url);

            let details = `total: ${data.data?.total || 'N/A'}\n`;
            details += `diff数量: ${data.data?.diff?.length || 0}\n`;

            const pass = data.data?.diff?.length > 0;
            addResult(name, pass ? 'PASS' : 'FAIL', details);
            return pass;
        } catch (e) {
            addResult(name, 'FAIL', `错误: ${e.message}\n(可能被CORS拦截，JSONP方式可用)`);
            return false;
        }
    }

    /**
     * 测试3: K线API (JSONP)
     */
    async function testKlineJsonp() {
        const name = 'K线API (kline + JSONP) - 贵州茅台';
        try {
            const cbName = 'jQuery_test3_' + Date.now();
            const url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.600519&ut=b2884a393a59ad64002292a3e90d46a5&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&end=20500101&lmt=5&_=' + Date.now();

            const data = await jsonp(url, cbName);

            let details = `股票代码: ${data.data?.code || 'N/A'}\n`;
            details += `股票名称: ${data.data?.name || 'N/A'}\n`;
            details += `K线条数: ${data.data?.klines?.length || 0}\n\n`;

            if (data.data?.klines?.length > 0) {
                details += 'K线数据:\n';
                data.data.klines.forEach((line, i) => {
                    const p = line.split(',');
                    details += `  [${i}] 日期=${p[0]}, 开盘=${p[1]}, 收盘=${p[2]}, 最高=${p[3]}, 最低=${p[4]}, 成交量=${p[5]}, 成交额=${p[6]}, 振幅=${p[7]}, 涨幅=${p[8]}, 涨跌额=${p[9]}, 换手率=${p[10]}\n`;
                });

                const fieldCount = data.data.klines[0].split(',').length;
                details += `\n每条K线字段数: ${fieldCount} (预期11) ${fieldCount === 11 ? 'OK' : 'MISMATCH'}`;
            }

            const pass = data.data?.klines?.length > 0;
            addResult(name, pass ? 'PASS' : 'FAIL', details);
            return pass;
        } catch (e) {
            addResult(name, 'FAIL', `错误: ${e.message}`);
            return false;
        }
    }

    /**
     * 测试4: K线API (Fetch)
     */
    async function testKlineFetch() {
        const name = 'K线API (kline + Fetch) - 贵州茅台';
        try {
            const url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=1.600519&ut=b2884a393a59ad64002292a3e90d46a5&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&end=20500101&lmt=5&_=' + Date.now();

            const data = await fetchApi(url);

            let details = `K线条数: ${data.data?.klines?.length || 0}\n`;
            const pass = data.data?.klines?.length > 0;
            addResult(name, pass ? 'PASS' : 'FAIL', details);
            return pass;
        } catch (e) {
            addResult(name, 'FAIL', `错误: ${e.message}\n(可能被CORS拦截，JSONP方式可用)`);
            return false;
        }
    }

    /**
     * 测试5: 不同市场secid格式
     */
    async function testSecidFormat() {
        const name = '不同市场secid格式验证';
        const testCases = [
            { secid: '1.600519', desc: '贵州茅台(沪市主板)' },
            { secid: '0.000001', desc: '平安银行(深市主板)' },
            { secid: '0.300750', desc: '宁德时代(创业板)' },
            { secid: '1.688981', desc: '中芯国际(科创板)' },
        ];

        let details = '';
        let allPass = true;

        for (const tc of testCases) {
            try {
                const cbName = 'jQuery_test5_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${tc.secid}&ut=b2884a393a59ad64002292a3e90d46a5&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&end=20500101&lmt=1&_=` + Date.now();

                const data = await jsonp(url, cbName);
                const stockName = data.data?.name || 'N/A';
                const klineCount = data.data?.klines?.length || 0;
                const ok = klineCount > 0;
                details += `${ok ? '[PASS]' : '[FAIL]'} ${tc.desc} secid=${tc.secid} -> 名称=${stockName}, K线数=${klineCount}\n`;
                if (!ok) allPass = false;
            } catch (e) {
                details += `[FAIL] ${tc.desc} secid=${tc.secid} -> 错误: ${e.message}\n`;
                allPass = false;
            }
        }

        addResult(name, allPass ? 'PASS' : 'FAIL', details);
        return allPass;
    }

    /**
     * 测试6: 涨幅排行 - 验证fs参数覆盖范围
     */
    async function testFsParam() {
        const name = 'fs参数覆盖范围验证';
        const testCases = [
            { fs: 'm:0+t:6,m:0+t:80', desc: '深市(创业板+创业板注册)' },
            { fs: 'm:1+t:2,m:1+t:23', desc: '沪市(主板+科创板)' },
            { fs: 'm:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23', desc: '全A股' },
        ];

        let details = '';
        let allPass = true;

        for (const tc of testCases) {
            try {
                const cbName = 'jQuery_test6_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                const url = `https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=3&po=1&np=1&ut=b2884a393a59ad64002292a3e90d46a5&fltt=2&invt=2&fid=f3&fs=${tc.fs}&fields=f12,f14,f2,f3,f13&_=` + Date.now();

                const data = await jsonp(url, cbName);
                const total = data.data?.total || 0;
                const diff = data.data?.diff || [];
                details += `[PASS] ${tc.desc} fs=${tc.fs} -> total=${total}\n`;
                if (diff.length > 0) {
                    diff.forEach((item, i) => {
                        details += `    [${i}] ${item.f12} ${item.f14} 涨幅=${item.f3}% 市场=${item.f13}\n`;
                    });
                }
                if (total === 0) allPass = false;
            } catch (e) {
                details += `[FAIL] ${tc.desc} -> 错误: ${e.message}\n`;
                allPass = false;
            }
        }

        addResult(name, allPass ? 'PASS' : 'FAIL', details);
        return allPass;
    }

    /**
     * 运行全部测试
     */
    async function runAllTests() {
        document.getElementById('results').innerHTML = '';
        document.getElementById('summary').style.display = 'none';

        const testResults = [];

        testResults.push(await testClistJsonp());
        testResults.push(await testClistFetch());
        testResults.push(await testKlineJsonp());
        testResults.push(await testKlineFetch());
        testResults.push(await testSecidFormat());
        testResults.push(await testFsParam());

        const passCount = testResults.filter(r => r).length;
        const total = testResults.length;

        const summary = document.getElementById('summary');
        summary.style.display = 'block';
        summary.innerHTML = `<h2>测试结果汇总: ${passCount}/${total} 通过</h2>` +
            testResults.map((r, i) => `<span class="${r ? 'pass' : 'fail'}">测试${i+1}: ${r ? 'PASS' : 'FAIL'}</span>`).join(' | ');
    }
    </script>
</body>
</html>
