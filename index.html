<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>股票严重异动监控系统</title>
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <!-- 顶部栏 -->
    <header class="header">
        <h1 class="header-title">股票严重异动监控系统</h1>
        <div class="header-actions">
            <span id="dataDate" class="data-date"></span>
            <button id="btnRefresh" class="btn btn-primary" title="刷新数据">刷新</button>
            <button id="btnSettings" class="btn btn-secondary" title="设置">设置</button>
        </div>
    </header>

    <!-- 统计概览 -->
    <section class="summary">
        <div class="summary-item">
            <span class="summary-label">100异动风险</span>
            <span id="count100" class="summary-value tag-100">0</span>
            <span class="summary-unit">只</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">200异动风险</span>
            <span id="count200" class="summary-value tag-200">0</span>
            <span class="summary-unit">只</span>
        </div>
        <div class="summary-item">
            <span class="summary-label">监控数量</span>
            <span id="countTotal" class="summary-value">0</span>
            <span class="summary-unit">只</span>
        </div>
    </section>

    <!-- 加载状态 -->
    <div id="loading" class="loading" style="display:none;">
        <div class="loading-spinner"></div>
        <span id="loadingText">正在加载数据...</span>
    </div>

    <!-- 错误提示 -->
    <div id="error" class="error" style="display:none;">
        <span id="errorText"></span>
        <button id="btnRetry" class="btn btn-primary btn-sm">重试</button>
    </div>

    <!-- 数据表格 -->
    <section id="tableSection" class="table-section">
        <div class="table-wrapper">
            <table id="stockTable" class="stock-table">
                <thead>
                    <tr>
                        <th class="col-rank">#</th>
                        <th class="col-name" data-sort="name">名称</th>
                        <th class="col-code">代码</th>
                        <th class="col-date">日期</th>
                        <th class="col-change" data-sort="change">当前幅度</th>
                        <th class="col-tag">异动类型</th>
                        <th class="col-deviation">偏离值</th>
                        <th class="col-triggered">是否触发</th>
                        <th class="col-trigger" data-sort="trigger0">6/15</th>
                        <th class="col-trigger" data-sort="trigger1">6/16</th>
                        <th class="col-trigger" data-sort="trigger2">6/17</th>
                        <th class="col-trigger" data-sort="trigger3">6/18</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody">
                </tbody>
            </table>
        </div>
    </section>

    <!-- 设置面板 -->
    <div id="settingsPanel" class="settings-panel" style="display:none;">
        <div class="settings-overlay"></div>
        <div class="settings-content">
            <h3>监控设置</h3>
            <div class="settings-group">
                <label for="settingTopN">监控数量（TOP N）</label>
                <input type="number" id="settingTopN" min="10" max="500" value="100">
            </div>
            <div class="settings-group">
                <label for="settingForwardDays">提前天数</label>
                <input type="number" id="settingForwardDays" min="1" max="10" value="5">
            </div>
            <div class="settings-group">
                <label for="settingAutoRefresh">自动刷新（秒，0=关闭）</label>
                <input type="number" id="settingAutoRefresh" min="0" max="600" value="0">
            </div>
            <div class="settings-group">
                <label for="settingRequestInterval">请求间隔（毫秒，建议300-1000）</label>
                <input type="number" id="settingRequestInterval" min="0" max="5000" value="500">
            </div>
            <div class="settings-group">
                <label>
                    <input type="checkbox" id="settingOnlyRisk" checked>
                    仅显示有异动风险的股票
                </label>
            </div>
            <hr class="settings-divider">
            <h4 class="settings-subtitle">代理配置</h4>
            <div class="settings-group">
                <label for="settingProxyUrl">主代理地址</label>
                <input type="text" id="settingProxyUrl" placeholder="https://your-proxy.vercel.app">
            </div>
            <div class="settings-group">
                <label for="settingBackupProxy">备用代理（每行一个）</label>
                <textarea id="settingBackupProxy" rows="2" placeholder="https://backup-proxy.example.com"></textarea>
            </div>
            <div class="settings-group">
                <label for="settingProxyToken">代理令牌（可选）</label>
                <input type="text" id="settingProxyToken" placeholder="留空则不发送">
            </div>
            <div class="settings-group">
                <span class="settings-hint">当前模式：<span id="currentMode">--</span></span>
                <button id="btnTestProxy" class="btn btn-secondary btn-sm" style="margin-left:8px;">测试代理</button>
            </div>
            <div class="settings-group" id="proxyTestResult" style="display:none;">
                <span class="settings-hint" id="proxyTestText"></span>
            </div>
            <div class="settings-actions">
                <button id="btnSaveSettings" class="btn btn-primary">保存</button>
                <button id="btnCancelSettings" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <!-- 底部信息 -->
    <footer class="footer">
        <span>数据来源：东方财富 | 异动规则：10天100% / 30天200%（严重异常波动，适用全A股）</span>
    </footer>

    <script src="js/api.js?v=15"></script>
    <script src="js/tradingCalendar.js?v=11"></script>
    <script src="js/calculator.js?v=15"></script>
    <script src="js/renderer.js?v=15"></script>
    <script src="js/main.js?v=16"></script>
</body>
</html>
